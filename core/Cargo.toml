[package]
name = "novelist"
version = "0.4.0"
description = "A desktop writing app for novelists"
authors = ["Chivier Humber"]
edition = "2021"

[lib]
name = "novelist_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Default features (wry, compression, common-controls-v6, dynamic-acl, x11)
# must stay enabled explicitly: tauri-specta <= rc.24 enabled them
# transitively, rc.25 stopped — without `wry` the build loses
# `tauri::Wry`/windowing entirely.
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "process", "time"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# TODO: upgrade to stable when tauri-specta 2.0.0 is released
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["function", "derive", "tokio"] }
notify = { version = "7", features = ["macos_fsevent"] }
blake3 = "1"
ropey = "1"
pulldown-cmark = "0.13"
ammonia = "4"
csscolorparser = "0.8"
dirs = "6"
rquickjs = { version = "0.9", features = ["bindgen", "loader", "parallel"] }
tauri-plugin-playwright = { version = "0.2", optional = true }
walkdir = "2"
chardetng = "1"
encoding_rs = "0.8"
base64 = "0.22"
cap-std = "4"
cap-fs-ext = "4"
once_cell = "1"
reqwest = { version = "0.12", features = ["rustls-tls", "stream", "multipart", "json"] }
futures-util = "0.3"
url = "2"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
urlencoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
png = "0.17"
specta-typescript = { version = "0.0.12", optional = true }
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3"

# macOS-only: needed to poke the NSWindow at setup time to disable the
# titlebar separator hairline (macOS 11+ draws a 1px line under the overlay
# title bar by default). Tauri doesn't expose this config, so we send the
# selector directly.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block2 = { version = "0.6", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = ["NSApplication", "NSBitmapImageRep", "NSEvent", "NSGraphicsContext", "NSImageRep", "NSResponder", "NSView", "NSWindow", "objc2-core-graphics"] }
objc2-core-foundation = { version = "0.3", optional = true, features = ["CFCGTypes"] }
objc2-core-graphics = { version = "0.3", optional = true, features = ["CGAffineTransform", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDataProvider", "CGGeometry", "CGImage", "CGPDFDocument", "CGPDFPage"] }
objc2-foundation = { version = "0.3", optional = true, features = ["NSData", "NSDictionary", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3", optional = true, features = ["WKPDFConfiguration", "WKWebView", "block2", "objc2-app-kit", "objc2-core-foundation"] }

[target.'cfg(windows)'.dependencies]
cap-primitives = "4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

# `objc` 0.2's `sel!` / `msg_send!` macros expand with `#[cfg(cargo-clippy)]`
# and the unmaintained crate never registered that cfg. Newer rustc flags it
# as `unexpected_cfgs`, which CI's `-D warnings` then turns into an error.
# Silence only this lint; the rest of the strict-warning policy stays.
[lints.rust]
unexpected_cfgs = "allow"

[features]
default = ["sync"]
dev = ["tauri/devtools", "codegen"]
codegen = ["dep:specta-typescript"]
sync = []
e2e-testing = [
  "dep:tauri-plugin-playwright",
  "dep:block2",
  "dep:objc2",
  "dep:objc2-app-kit",
  "dep:objc2-core-foundation",
  "dep:objc2-core-graphics",
  "dep:objc2-foundation",
  "dep:objc2-web-kit",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
wiremock = "0.6"
