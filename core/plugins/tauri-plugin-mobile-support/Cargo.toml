[package]
name = "tauri-plugin-mobile-support"
version = "0.1.0"
authors = ["Novelist"]
description = "Novelist native share sheet and secure credential vault for iOS/Android"
edition = "2021"
rust-version = "1.77.2"
publish = false
links = "tauri-plugin-mobile-support"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
