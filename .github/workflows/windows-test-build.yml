# TEMPORARY workflow — builds a Windows installer as an artifact (no GitHub
# Release) so the emit_to-broadcast fix can be verified on the test machine.
# Remove this file before merging the fix branch.
name: windows-test-build

on:
  push:
    branches: [fix/windows-emit-to-broadcast-routing]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install frontend dependencies
        run: pnpm install

      - name: Run frontend + Rust tests
        run: pnpm test && cd core && cargo test

      # No tagName → tauri-action builds but does NOT create/publish a release.
      - name: Build Tauri app (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: core

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: novelist-windows-setup
          path: |
            core/target/release/bundle/nsis/*-setup.exe
            core/target/release/bundle/msi/*.msi
          if-no-files-found: error
