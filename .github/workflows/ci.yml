name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    env:
      PANDOC_VERSION: "3.10"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo registry + target
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Pandoc
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64)
              archive_name="pandoc-${PANDOC_VERSION}-arm64-macOS.zip"
              archive_sha256="d9cad01d96ae774a0dc8c8c45bb1ad3e4c5ff2cc2e24f45958f5f9b7974aee34"
              extracted_dir="pandoc-${PANDOC_VERSION}-arm64"
              ;;
            x86_64)
              archive_name="pandoc-${PANDOC_VERSION}-x86_64-macOS.zip"
              archive_sha256="6334f4d9af7c9e37e761dfad56fa5507685f6d29724ebf31c4be6d5c654a3161"
              extracted_dir="pandoc-${PANDOC_VERSION}-x86_64"
              ;;
            *)
              echo "Unsupported macOS architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          archive_path="${RUNNER_TEMP}/${archive_name}"
          install_dir="${RUNNER_TEMP}/pandoc-${PANDOC_VERSION}"
          curl -fsSL \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/${archive_name}" \
            -o "${archive_path}"
          printf '%s  %s\n' "${archive_sha256}" "${archive_path}" | shasum -a 256 -c -
          mkdir -p "${install_dir}"
          ditto -x -k "${archive_path}" "${install_dir}"
          echo "${install_dir}/${extracted_dir}/bin" >> "${GITHUB_PATH}"

      - name: Svelte type check
        run: pnpm check

      - name: Vitest (with coverage)
        run: pnpm test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vitest-coverage
          path: coverage/
          retention-days: 14

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps webkit

      - name: Run E2E tests (browser mode)
        run: pnpm test:e2e:browser

      - name: Cargo format check
        working-directory: core
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        working-directory: core
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Cargo test
        working-directory: core
        run: cargo test --locked

      - name: Real Pandoc 3.10 CJK and styled-copy matrices
        run: pnpm test:rust:pandoc

  check-windows-pandoc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Verify full Windows Rust suite
        working-directory: core
        run: cargo test --locked

      - name: Windows strict Clippy
        working-directory: core
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  check-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo registry + target
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo check
        working-directory: core
        run: cargo check --locked --all-targets

      - name: Cargo test
        working-directory: core
        run: cargo test --locked
