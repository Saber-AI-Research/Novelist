name: Mobile CI

# Compile and package checks for iOS and Android. Needs no secrets: Android
# produces a debug-signed APK, iOS an unsigned simulator app that is launched
# on fresh iPhone and iPad simulators (scripts/mobile-ios-smoke.mjs). Signed
# builds live in mobile-release.yml.

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
      - '.cargo/**'
      - 'plugins/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'svelte.config.js'
      - 'tsconfig*.json'
      - 'scripts/mobile*'
      - 'scripts/app-version.mjs'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.93.1
  XCODE_VERSION: '26.6'

jobs:
  android:
    name: Android (aarch64 + x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,x86_64-linux-android
          components: clippy

      - name: Cache Cargo and Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-mobile-android-${{ hashFiles('core/Cargo.lock', 'core/gen/android/**/*.gradle.kts', 'core/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-mobile-android-

      - name: Install libclang (rquickjs bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Use JDK 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Pin Android SDK and NDK
        run: node scripts/mobile.mjs android ci-sdk

      - name: Validate toolchain
        run: node scripts/mobile.mjs android doctor

      - name: Clippy (default features, both ABIs)
        run: node scripts/mobile.mjs android check

      # `check` built dist/ (generate_context! needs it); reuse it here.
      - name: Debug APK without release credentials
        run: node scripts/mobile.mjs android build --skip-frontend

      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: novelist-android-debug
          path: core/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          retention-days: 7
          if-no-files-found: error

  ios:
    name: iOS (device + simulator targets, simulator app)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-mobile-ios-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-mobile-ios-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate toolchain
        run: node scripts/mobile.mjs ios doctor

      - name: Clippy (device + simulator, default features)
        run: node scripts/mobile.mjs ios check

      - name: Simulator app without signing
        id: ios-build
        run: node scripts/mobile.mjs ios build --skip-frontend

      # Also after a failed build: the evidence then records what it left behind.
      - name: Simulator smoke (fresh iPhone + iPad, launch, screenshots)
        id: ios-smoke
        if: ${{ !cancelled() && steps.ios-build.outcome != 'skipped' }}
        timeout-minutes: 30
        run: node scripts/mobile-ios-smoke.mjs --out "$RUNNER_TEMP/novelist-ios-smoke"

      - name: Upload simulator smoke evidence
        if: ${{ !cancelled() && steps.ios-smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: novelist-ios-simulator-smoke
          path: ${{ runner.temp }}/novelist-ios-smoke
          retention-days: 7
          if-no-files-found: error
          overwrite: true
