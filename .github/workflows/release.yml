name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Self-hosted macOS ARM build (M1/M2) ───────────────
  build-macos-arm:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm check && pnpm test && cd core && cargo fmt --all -- --check && cargo clippy --locked --all-targets --all-features -- -D warnings && cargo test --locked

      - name: Install pinned Pandoc 3.10
        env:
          PANDOC_VERSION: '3.10'
        run: |
          set -euo pipefail
          archive_name="pandoc-${PANDOC_VERSION}-arm64-macOS.zip"
          archive_sha256="d9cad01d96ae774a0dc8c8c45bb1ad3e4c5ff2cc2e24f45958f5f9b7974aee34"
          archive_path="${RUNNER_TEMP}/${archive_name}"
          install_dir="${RUNNER_TEMP}/pandoc-${PANDOC_VERSION}"
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/${archive_name}" -o "${archive_path}"
          printf '%s  %s\n' "${archive_sha256}" "${archive_path}" | shasum -a 256 -c -
          mkdir -p "${install_dir}"
          ditto -x -k "${archive_path}" "${install_dir}"
          echo "${install_dir}/pandoc-${PANDOC_VERSION}-arm64/bin" >> "${GITHUB_PATH}"

      - name: Real Pandoc 3.10 contract matrix
        run: pnpm test:rust:pandoc

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build -- --locked

      - name: Create styled DMG
        if: always()
        continue-on-error: true
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP="core/target/release/bundle/macos/Novelist.app"
          DMG="core/target/release/bundle/dmg/Novelist_${VERSION}_aarch64.dmg"
          if [ ! -f "$DMG" ]; then
            bash scripts/create-dmg.sh "$APP" "$DMG"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: novelist-macos-aarch64
          path: |
            core/target/release/bundle/dmg/*.dmg
            core/target/release/bundle/macos/*.app.tar.gz
            core/target/release/bundle/macos/*.app.tar.gz.sig

  # ── GitHub-hosted builds (Intel Mac, Linux, Windows) ──
  build-other:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            tauri-args: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            tauri-args: ""
          # Intel Mac DMG is cross-compiled from a GitHub-hosted Apple Silicon
          # runner. macos-13 (the last GitHub-hosted Intel runner) is in the
          # tail end of its retirement window with multi-hour queue times, so
          # we use macos-14 + `rustup target add x86_64-apple-darwin` instead.
          # ARM mac is built natively on the self-hosted runner above.
          - platform: macos-14
            target: x86_64-apple-darwin
            tauri-args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 9

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm check && pnpm test && cd core && cargo fmt --all -- --check && cargo clippy --locked --all-targets --all-features -- -D warnings && cargo test --locked

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: core
          args: ${{ matrix.tauri-args }} -- --locked
          tagName: ${{ github.ref_name }}
          releaseName: 'Novelist ${{ github.ref_name }}'
          releaseBody: |
            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      - name: Stage Windows portable zips
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = "${{ github.ref_name }}" -replace '^v',''
          $rel = "core/target/release"
          $outDir = "$rel/bundle/zip"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          # ---- standard zip (user-profile mode: data in %USERPROFILE%\.novelist) ----
          $std = "Novelist_${ver}_x64_windows"
          if (Test-Path $std) { Remove-Item $std -Recurse -Force }
          New-Item -ItemType Directory -Path $std | Out-Null
          # Cargo bin is `novelist.exe`; rename to `Novelist.exe` for user-facing zip.
          Copy-Item "$rel/novelist.exe" "$std/Novelist.exe"
          if (Test-Path "$rel/resources") {
            Copy-Item "$rel/resources" "$std/" -Recurse
          }
          if (Test-Path "$rel/WebView2Loader.dll") {
            Copy-Item "$rel/WebView2Loader.dll" "$std/"
          }
          Compress-Archive -Path "$std/*" -DestinationPath "$outDir/$std.zip" -Force

          # ---- portable zip (same-dir mode) ----
          $pt = "Novelist_${ver}_x64_windows-portable"
          if (Test-Path $pt) { Remove-Item $pt -Recurse -Force }
          Copy-Item $std $pt -Recurse
          New-Item -ItemType File -Path "$pt/portable.dat" -Force | Out-Null
          Compress-Archive -Path "$pt/*" -DestinationPath "$outDir/$pt.zip" -Force

          Get-ChildItem $outDir | Format-Table Name, Length

      - name: Upload Windows portable zips
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: novelist-windows-portable
          path: core/target/release/bundle/zip/*.zip

  # ── Create GitHub Release with ARM artifacts + updater JSON ──
  release:
    needs: [build-macos-arm, build-other]
    runs-on: ubuntu-latest
    if: needs.build-macos-arm.result == 'success' && needs.build-other.result == 'success'
    steps:
      - name: Download macOS ARM artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: novelist-macos-aarch64
          path: artifacts/

      - name: Download Windows portable artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: novelist-windows-portable
          path: artifacts/windows-portable/

      - name: Upload ARM DMG + updater files to Release
        if: hashFiles('artifacts/**/*.dmg') != '' || hashFiles('artifacts/**/*.tar.gz') != ''
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.tar.gz
            artifacts/**/*.tar.gz.sig
            artifacts/windows-portable/*.zip
          tag_name: ${{ github.ref_name }}
          draft: true

      # `tauri-action` runs only on the Linux + Windows matrix legs, so the
      # `latest.json` it generates contains only the linux-* and windows-*
      # platform entries. The macOS ARM job is self-hosted and bypasses
      # tauri-action entirely, which means without this step macOS users
      # would never see updates surfaced via the updater plugin. Inject the
      # darwin-aarch64 entry by reading the .app.tar.gz.sig produced by the
      # ARM build and merging it into the existing latest.json.
      - name: Patch latest.json with darwin-aarch64 entry
        if: hashFiles('artifacts/**/*.app.tar.gz.sig') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SIG_FILE=$(find artifacts -name 'Novelist.app.tar.gz.sig' -print -quit)
          if [ -z "$SIG_FILE" ]; then
            echo "No darwin signature file found; skipping latest.json patch."
            exit 0
          fi
          SIG=$(tr -d '\n' < "$SIG_FILE")
          URL="https://github.com/$REPO/releases/download/$TAG/Novelist.app.tar.gz"

          # Wait briefly for tauri-action's latest.json upload to settle in
          # case this job races ahead of the matrix legs' final asset push.
          for attempt in 1 2 3 4 5; do
            if gh release download "$TAG" --pattern latest.json --output latest.json --repo "$REPO" --clobber 2>/dev/null; then
              break
            fi
            echo "latest.json not yet available (attempt $attempt); retrying in 10s..."
            sleep 10
          done
          if [ ! -s latest.json ]; then
            echo "Could not fetch latest.json from release after retries; aborting." >&2
            exit 1
          fi

          jq --arg sig "$SIG" --arg url "$URL" \
             '.platforms["darwin-aarch64"] = { signature: $sig, url: $url }' \
             latest.json > latest.json.new
          mv latest.json.new latest.json

          echo "--- Patched latest.json ---"
          jq '.platforms | keys' latest.json
          gh release upload "$TAG" latest.json --clobber --repo "$REPO"

  # ── Bump Homebrew Cask in Saber-AI-Research/homebrew-novelist ──
  # Downloads the just-published mac DMGs, computes sha256, rewrites
  # Casks/novelist.rb in the tap repo, and pushes. Requires a PAT in
  # the HOMEBREW_TAP_TOKEN secret with `contents:write` on the tap repo.
  bump-tap:
    needs: release
    runs-on: ubuntu-latest
    # A tag build leaves the GitHub release drafted. Update the tap only from a
    # separately reviewed/manual publication flow.
    if: ${{ false }}
    steps:
      - name: Download mac DMGs from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir -p dmgs
          # Both DMGs may upload at slightly different times; retry briefly.
          for attempt in 1 2 3 4 5 6; do
            gh release download "$TAG" --repo "$REPO" --dir dmgs --clobber \
              --pattern "Novelist_${VERSION}_aarch64.dmg" \
              --pattern "Novelist_${VERSION}_x64.dmg" && break || true
            echo "DMGs not yet available (attempt $attempt); retrying in 15s..."
            sleep 15
          done
          ARM_DMG="dmgs/Novelist_${VERSION}_aarch64.dmg"
          INTEL_DMG="dmgs/Novelist_${VERSION}_x64.dmg"
          if [ ! -s "$ARM_DMG" ] || [ ! -s "$INTEL_DMG" ]; then
            echo "Missing DMGs; cannot bump cask." >&2
            ls -la dmgs/ || true
            exit 1
          fi
          ARM_SHA=$(sha256sum "$ARM_DMG"   | awk '{print $1}')
          INTEL_SHA=$(sha256sum "$INTEL_DMG" | awk '{print $1}')
          {
            echo "VERSION=$VERSION"
            echo "ARM_SHA=$ARM_SHA"
            echo "INTEL_SHA=$INTEL_SHA"
          } >> "$GITHUB_ENV"

      - name: Checkout tap repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: true
          repository: Saber-AI-Research/homebrew-novelist
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render Casks/novelist.rb
        run: |
          set -euo pipefail
          mkdir -p tap/Casks
          cat > tap/Casks/novelist.rb <<EOF
          cask "novelist" do
            arch arm: "aarch64", intel: "x64"

            version "${VERSION}"
            sha256 arm:   "${ARM_SHA}",
                   intel: "${INTEL_SHA}"

            url "https://github.com/Saber-AI-Research/Novelist/releases/download/v#{version}/Novelist_#{version}_#{arch}.dmg",
                verified: "github.com/Saber-AI-Research/Novelist/"
            name "Novelist"
            desc "Lightweight WYSIWYG Markdown desktop writing app for novelists"
            homepage "https://github.com/Saber-AI-Research/Novelist"

            livecheck do
              url :url
              strategy :github_latest
            end

            auto_updates true

            app "Novelist.app"

            zap trash: [
              "~/Library/Application Support/com.novelist.desktop",
              "~/Library/Caches/com.novelist.desktop",
              "~/Library/Logs/com.novelist.desktop",
              "~/Library/Preferences/com.novelist.desktop.plist",
              "~/Library/Saved Application State/com.novelist.desktop.savedState",
              "~/.novelist",
            ]
          end
          EOF

      - name: Commit and push to tap
        run: |
          set -euo pipefail
          cd tap
          git config user.name  "novelist-release-bot"
          git config user.email "release-bot@novelist.dev"
          if git diff --quiet -- Casks/novelist.rb; then
            echo "Cask already up to date; nothing to commit."
            exit 0
          fi
          git add Casks/novelist.rb
          git commit -m "novelist ${VERSION}"
          git push origin HEAD
